services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file: .env.production
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/exchange_platform
    depends_on:
      db:
        condition: service_healthy
    restart: always

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: exchange_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

volumes:
  pgdata:
